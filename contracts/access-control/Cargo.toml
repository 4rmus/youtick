[package]
name = "youtick-access-control"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.5.7"
near-sdk = { version = "=5.5.0", default-features = false, features = ["legacy"] }

[dev-dependencies]
near-crypto = { version = "0.26.0", features = ["rand"] }
near-sdk = { version = "=5.5.0", default-features = false, features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
