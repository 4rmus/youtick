[package]
name = "youtick-nft"
version = "1.0.0"
edition = "2021"

[features]
default = []
migration = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing", "legacy"] }
schemars = { version = "0.8", features = ["derive"] }
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing", "legacy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
near-workspaces = { version = "0.14", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
