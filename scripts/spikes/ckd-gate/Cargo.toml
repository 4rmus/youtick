[package]
name = "ckd-gate"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9", features = ["legacy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
base64 = "0.22"
hex = "0.4"
# fast-auth's RS256 verifier from base-jwt-guard, pinned; build with fast-auth's Cargo.lock unchanged
base-jwt-guard = { git = "https://github.com/Peersyst/fast-auth", rev = "8f84383" }

[dev-dependencies]
near-sdk = { version = "5.9", features = ["unit-testing"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
