name = "youtick-media-delivery"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,https://youtick.net,https://www.youtick.net"
CRUST_READ_ENDPOINT = "https://crustipfs.xyz/api/v0/cat"
IPFS_GATEWAY_BASES = "https://ipfs.io/ipfs,https://4everland.io/ipfs,https://w3s.link/ipfs,https://gateway.lighthouse.storage/ipfs,https://dweb.link/ipfs"
CACHE_TTL_SECONDS = "300"
UPSTREAM_TIMEOUT_MS = "4000"
