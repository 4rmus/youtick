name = "youtick-livepeer-bridge"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
LIVEPEER_BRIDGE_ENABLED = "false"
LIVEPEER_NEW_UPLOADS_ENABLED = "false"
LIVEPEER_PLAYBACK_ISSUANCE_ENABLED = "false"
LIVEPEER_PROVIDER_MUTATIONS_ENABLED = "false"
LIVEPEER_OPERATOR_MUTATIONS_ENABLED = "false"
UPLOAD_JOB_ARCHIVE_ENABLED = "false"
OPERATOR_OUTBOX_ARCHIVE_ENABLED = "false"
LIVEPEER_PLAYBACK_V2_ENABLED = "false"
LIVEPEER_PLAYBACK_SHADOW_V2_ENABLED = "false"
LIVEPEER_WEBHOOK_QUEUE_ENABLED = "false"
LIVEPEER_WEBHOOK_QUEUE_BATCH_SIZE = "10"
LIVEPEER_WEBHOOK_QUEUE_BATCH_TIMEOUT_SECONDS = "5"
LIVEPEER_WEBHOOK_QUEUE_MAX_RETRIES = "3"
LIVEPEER_WEBHOOK_QUEUE_MAX_CONCURRENCY = "1"
LIVEPEER_WEBHOOK_QUEUE_RETENTION_SECONDS = "345600"
LIVEPEER_WEBHOOK_QUEUE_DLQ = "youtick-livepeer-events-dlq-testnet"
LIVEPEER_NEAR_CREATOR_FEE_ENABLED = "false"
LIVEPEER_SPONSORED_UPLOADS_ENABLED = "false"
LIVEPEER_SPONSOR_RELAYER_MUTATIONS_ENABLED = "false"
MULTI_ASSET_PAYMENTS_MODE = "off"
MULTI_ASSET_PAYMENT_ASSET_IDS = "nep141:base-0x833589fcd6edb6e08f4c7c32d4f71b54bda02913.omft.near,nep141:arb-0xaf88d065e77c8cc2239327c5edb3a432268e5831.omft.near,nep141:wrap.near,nep141:usdt.tether-token.near"
ALLOWED_ORIGINS = "https://youtick.net,https://www.youtick.net"
NEAR_NETWORK = "testnet"
NEAR_RPC_URL = "<replace-with-dedicated-near-rpc-url>"
MARKET_CONTRACT_ID = "<replace-with-paid-media-livepeer-v1-contract-id>"
ACCESS_CONTRACT_ID = "<replace-with-access-contract-id>"
LIVEPEER_PROJECT_ID = "<replace-with-livepeer-project-id>"
LIVEPEER_API_TOKEN_NAME = "<replace-with-livepeer-api-token-name>"
LIVEPEER_CREATOR_ALLOWLIST = ""
LIVEPEER_MONTHLY_OPERATION_BUDGET_USD_MICROS = ""
LIVEPEER_JOB_OPERATION_RESERVATION_USD_MICROS = ""
LIVEPEER_PAID_MEDIA_OPERATOR_ID = "<replace-with-paid-media-operator-id>"
LIVEPEER_JWT_PUBLIC_KEY = "<replace-with-livepeer-jwt-public-key>"
LIVEPEER_JWT_ISSUER = "https://youtick.net"
NEAR_OPERATOR_ACCOUNT_ID = "<replace-with-livepeer-bridge-account-id>"
NEAR_OPERATOR_KEY_EPOCH = "1"
NEAR_SPONSOR_RELAYER_ACCOUNT_ID = "<replace-with-dedicated-sponsor-relayer-account-id>"
NEAR_SPONSOR_RELAYER_KEY_EPOCH = "1"
CREATOR_FEE_QUOTE_KEY_VERSION = "1"

[[queues.producers]]
binding = "LIVEPEER_EVENTS"
queue = "youtick-livepeer-events-testnet"

[[queues.consumers]]
queue = "youtick-livepeer-events-testnet"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
dead_letter_queue = "youtick-livepeer-events-dlq-testnet"

[[d1_databases]]
binding = "MARKET_READ_MODEL"
database_name = "youtick-market-read-model-v1-testnet"
database_id = "50b1e14f-2b06-444b-98cf-b828f11277ef"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "LIVEPEER_CONTROL"
class_name = "LivepeerControl"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivepeerControl"]
