name = "youtick-storage-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,https://youtick.net,https://www.youtick.net"
STORAGE_PROVIDER = "lighthouse"
LIGHTHOUSE_API_BASE = "https://api.lighthouse.storage"
ENABLE_LIGHTHOUSE_UPLOADS = "true"

# Set with:
# npx wrangler secret put LIGHTHOUSE_API_KEY
