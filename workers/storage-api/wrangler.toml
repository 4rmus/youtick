name = "youtick-storage-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://youtick.net,https://www.youtick.net"
STORAGE_PROVIDER = "lighthouse"
LIGHTHOUSE_API_BASE = "https://api.lighthouse.storage"
ENABLE_LIGHTHOUSE_UPLOADS = "true"

# Set with:
# npx wrangler secret put LIGHTHOUSE_API_KEY
# npx wrangler secret put UPLOAD_INTENT_SECRET
#
[[kv_namespaces]]
binding = "UPLOAD_GUARD"
id = "<replace-with-upload-guard-kv-namespace-id>"
