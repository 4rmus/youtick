name = "youtick-storage-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://youtick.net,https://www.youtick.net"
STORAGE_PROVIDER = "lighthouse"
LIGHTHOUSE_API_BASE = "https://api.lighthouse.storage"
ENABLE_LIGHTHOUSE_UPLOADS = "true"
R2_INGEST_ENABLED = "false"
R2_ACCOUNT_ID = "<replace-with-32-character-cloudflare-account-id>"
R2_JURISDICTION = "eu"
R2_RAW_BUCKET_NAME = "<replace-with-private-raw-media-bucket>"
NEAR_RPC_URL = "<replace-with-dedicated-near-rpc-url>"
MARKET_CONTRACT_ID = "<replace-with-paid-media-v4-market-contract-id>"

# Set with:
# npx wrangler secret put LIGHTHOUSE_API_KEY
# npx wrangler secret put UPLOAD_INTENT_SECRET
# npx wrangler secret put R2_ACCESS_KEY_ID
# npx wrangler secret put R2_SECRET_ACCESS_KEY
#
[[kv_namespaces]]
binding = "UPLOAD_GUARD"
id = "<replace-with-upload-guard-kv-namespace-id>"

[[r2_buckets]]
binding = "RAW_MEDIA_BUCKET"
bucket_name = "replace-with-private-raw-media-bucket"

[[durable_objects.bindings]]
name = "R2_INGEST_SESSIONS"
class_name = "R2IngestSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["R2IngestSession"]
