name = "web4-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Primary origin — Cloudflare Pages (fast, reliable)
WEB4_ORIGIN = "https://youtick-static.pages.dev"
# Fallback origin — NEAR Web4 gateway (used if primary is unreachable or returns error)
WEB4_FALLBACK_ORIGIN = "https://youtick.near.page"

# Domains that this proxy will serve (for Host header validation)
ALLOWED_DOMAINS = "youtick.net,www.youtick.net"

# Optional: Custom cache TTL in seconds (default: 300 = 5 min)
CACHE_TTL = "300"

# Custom Domains
[[routes]]
pattern = "youtick.net"
custom_domain = true

[[routes]]
pattern = "www.youtick.net/*"
zone_name = "youtick.net"
