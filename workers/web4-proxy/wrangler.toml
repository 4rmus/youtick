name = "web4-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# NEAR Web4 gateway URL for the youtick.near contract
WEB4_ORIGIN = "https://youtick.near.page"

# Domains that this proxy will serve (for Host header validation)
ALLOWED_DOMAINS = "youtick.net,www.youtick.net"

# Optional: Custom cache TTL in seconds (default: 300 = 5 min)
CACHE_TTL = "300"

# Custom Domains
[[routes]]
pattern = "youtick.net"
custom_domain = true

[[routes]]
pattern = "www.youtick.net/*"
zone_name = "youtick.net"
