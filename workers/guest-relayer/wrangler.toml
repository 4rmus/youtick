name = "guest-relayer"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788

[vars]
ALLOWED_ORIGINS = "https://youtick.near.page,https://youtick.net,https://www.youtick.net,http://localhost:3000"
NEAR_CONTRACT_ID = "youtick.near"
NEAR_NETWORK = "mainnet"
RELAYER_ACCOUNT_ID = ""

[[durable_objects.bindings]]
name = "GUEST_LIMITER"
class_name = "GuestLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuestLimiter"]

[env.testnet]
name = "guest-relayer-testnet"

[env.testnet.vars]
ALLOWED_ORIGINS = "http://localhost:3000"
NEAR_CONTRACT_ID = "dev-1773607954211-252231.v2-0.utick.testnet"
NEAR_NETWORK = "testnet"
RELAYER_ACCOUNT_ID = ""

[[env.testnet.durable_objects.bindings]]
name = "GUEST_LIMITER"
class_name = "GuestLimiter"
