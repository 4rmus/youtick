# Configuration only; deploys run through protected workflows (none exists for this Worker yet).
name = "youtick-payment-service"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
PAYMENT_SERVICE_ENABLED = "false"
NEAR_NETWORK = "testnet"
NEAR_RPC_URL = "<replace-with-dedicated-near-rpc-url>"
MARKET_V2_CONTRACT_ID = "<replace-with-market-v2-contract-id>"
# Testnet only until the tax adviser's evidence policy (roadmap X3): one VAT-inclusive rate for all.
VAT_POLICY = "fixed-testnet"
VAT_RATE_BPS = "2000"
VAT_KEY_VERSION = "1"
ALLOWED_ORIGINS = "https://youtick.net,https://www.youtick.net"
# Card path (roadmap E8). Off: the Cleeng adapter (src/cleeng.ts) has not met the sandbox (X1).
# Turning it on is its own gate (README, "Card path"): it adds PAYMENT_OPERATOR_ID, the CARD_OPERATOR
# Durable Object binding with its migration, a "*/5 * * * *" cron, CLEENG_ENVIRONMENT = "sandbox",
# CLEENG_PUBLISHER_ID and the card secrets.
CARD_PATH_ENABLED = "false"
# Secrets (wrangler secret put): VAT_SIGNER_PRIVATE_KEY, REFUND_ADMIN_TOKEN (operator tools, >= 32 characters).
# Card path only, when enabled: PAYMENT_OPERATOR_PRIVATE_KEY, CARD_REFERENCE_SECRET (32 bytes, 64 hex),
# CLEENG_PUBLISHER_TOKEN, CLEENG_WEBHOOK_SECRET.

[[ratelimits]]
name = "PAYMENT_RATE_LIMITER"
namespace_id = "3201"
simple = { limit = 20, period = 60 }

# Checkout funnel counts: step, rail and a fixed failure code only (src/funnel.ts).
[[analytics_engine_datasets]]
binding = "FUNNEL"
dataset = "youtick_checkout_funnel"

# Payments database: refund request inbox (src/refunds.ts) and card orders and ledger (E8), migrations/. The all-zero id is a placeholder: the V2
# testnet release writes the real id from the repository variable V2_PAYMENTS_D1_ID.
[[d1_databases]]
binding = "REFUNDS"
database_name = "youtick-payments-v2-testnet"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
