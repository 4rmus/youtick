name = "youtick-kms"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Production (mainnet) default environment. See README.md for KV, secret and
# operator deploy procedure.
[vars]
ALLOWED_ORIGINS = "https://youtick.near.page,https://youtick.net,https://www.youtick.net"
NEAR_CONTRACT_ID = "youtick.near"
NEAR_ACCESS_CONTRACT_ID = "access.youtick.near"
NEAR_REGISTRY_CONTRACT_ID = "registry.youtick.near"
NEAR_NETWORK = "mainnet"
CACHE_KEY_PREFIX = "v2:"

# Default environment is local development only. Replace placeholders with
# dedicated local KV namespace IDs before running wrangler dev.
[[kv_namespaces]]
binding = "VIDEO_KEYS"
id = "<replace-with-your-local-dev-video-keys-namespace-id>"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "<replace-with-your-local-dev-rate-limit-namespace-id>"

[[kv_namespaces]]
binding = "ACCESS_CACHE"
id = "<replace-with-your-local-dev-access-cache-namespace-id>"

# Multi-operator production environments. Each operator needs isolated KV
# namespaces and unique secrets; see README.md.

[env.operator_a]
name = "youtick-kms-a"

[env.operator_a.vars]
CACHE_KEY_PREFIX = "v2:"
ALLOWED_ORIGINS = "https://youtick.near.page,https://youtick.net,https://www.youtick.net"
NEAR_CONTRACT_ID = "youtick.near"
NEAR_ACCESS_CONTRACT_ID = "access.youtick.near"
NEAR_REGISTRY_CONTRACT_ID = "registry.youtick.near"
NEAR_NETWORK = "mainnet"
REGISTRY_OPERATOR_ACCOUNT_ID = "kms-a.youtick.near"

[[env.operator_a.kv_namespaces]]
binding = "VIDEO_KEYS"
id = "<replace-with-operator-a-video-keys-kv-namespace-id>"

[[env.operator_a.kv_namespaces]]
binding = "RATE_LIMIT"
id = "<replace-with-operator-a-rate-limit-kv-namespace-id>"

[[env.operator_a.kv_namespaces]]
binding = "ACCESS_CACHE"
id = "<replace-with-operator-a-access-cache-kv-namespace-id>"

