# Testnet environment — local development only
[env.testnet]
name = "youtick-kms-testnet"

[env.testnet.vars]
ALLOWED_ORIGINS = "http://localhost:3000"
NEAR_CONTRACT_ID = "dev-1773607954211-252231.v2-0.utick.testnet"
NEAR_ACCESS_CONTRACT_ID = "access-1773606802388.v2-0.utick.testnet"
NEAR_REGISTRY_CONTRACT_ID = "registry-1773606802388.v2-0.utick.testnet"
REGISTRY_OPERATOR_ACCOUNT_ID = "kms-a.v2-0.utick.testnet"
OPERATOR_SHARE_SECRET = ""
NEAR_NETWORK = "testnet"

[[env.testnet.kv_namespaces]]
binding = "VIDEO_KEYS"
# Use a dedicated testnet namespace ID here. Do not reuse the production one.
id = "<replace-with-testnet-video-keys-namespace-id>"

[[env.testnet.kv_namespaces]]
binding = "RATE_LIMIT"
# Use a dedicated testnet namespace ID here. Do not reuse the production one.
id = "<replace-with-testnet-rate-limit-namespace-id>"

[[env.testnet.kv_namespaces]]
