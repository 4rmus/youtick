name: Feature request
description: Suggest a useful improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: web, contracts, Livepeer Bridge, protocol, docs
