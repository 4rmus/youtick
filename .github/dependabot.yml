# Weekly, grouped dependency updates. Every PR still needs CI and review.
# Toolchain- and protocol-coupled packages are excluded on purpose and are
# upgraded by hand in their own gate:
# - wrangler / @cloudflare/workers-types / @opennextjs/cloudflare: pinned in
#   scripts/cloudflare-release.mjs and promote-production.yml or produce the
#   deployed Worker; require a Preview deploy check.
# - NEAR SDKs (near-api-js, @near-js/*, wallet, 1Click, borsh): payment and
#   signing paths; reviewed with the project NEAR skills.
# - Media stack (hls.js, tus-js-client, @livepeer/react): exact-pinned player
#   and resumable-upload clients; need player/upload checks on Preview.
# - Contract crates: Cargo.lock keeps one version per crate, so bumping a crate
#   that also reaches the wasm32 graph (borsh, serde, serde_json, near-*)
#   changes contract WASM under the pinned Rust 1.86.0. Cargo updates are
#   therefore an allowlist of crates verified absent from the wasm32 graph
#   (`cargo tree -e normal,build --target wasm32-unknown-unknown -i <crate>`).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /apps/web
      - /workers/livepeer-bridge
      - /docs
      - /scripts/near-auth-provider-handoff
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: wrangler
      - dependency-name: "@cloudflare/workers-types"
      - dependency-name: "@opennextjs/cloudflare"
      - dependency-name: near-api-js
      - dependency-name: "@near-js/*"
      - dependency-name: "@hot-labs/near-connect"
      - dependency-name: "@defuse-protocol/*"
      - dependency-name: borsh
      - dependency-name: hls.js
      - dependency-name: tus-js-client
      - dependency-name: "@livepeer/react"
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /contracts/nft-ticket
      - /contracts/access-control
      - /contracts/nft-ticket/tests/mock-ft
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    versioning-strategy: lockfile-only
    commit-message:
      prefix: "chore(contracts)"
    allow:
      - dependency-name: tokio
      - dependency-name: anyhow
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-lockfile:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
