# Weekly, grouped dependency updates. Every PR still needs CI and review.
# Toolchain- and protocol-coupled packages are excluded on purpose and are
# upgraded by hand in their own gate:
# - wrangler / @cloudflare/workers-types: pinned in scripts/cloudflare-release.mjs
#   and promote-production.yml; require a Preview deploy check.
# - NEAR SDKs (near-api-js, @near-js/*, wallet, 1Click, borsh): payment and
#   signing paths; reviewed with the project NEAR skills.
# - near-sdk / near-sys / near-workspaces: change contract WASM and are tied to
#   the pinned Rust 1.86.0 toolchain.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /apps/web
      - /workers/livepeer-bridge
      - /docs
      - /scripts/near-auth-provider-handoff
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: wrangler
      - dependency-name: "@cloudflare/workers-types"
      - dependency-name: near-api-js
      - dependency-name: "@near-js/*"
      - dependency-name: "@hot-labs/near-connect"
      - dependency-name: "@defuse-protocol/*"
      - dependency-name: borsh
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /contracts/nft-ticket
      - /contracts/access-control
      - /contracts/nft-ticket/tests/mock-ft
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    versioning-strategy: lockfile-only
    commit-message:
      prefix: "chore(contracts)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: near-sdk
      - dependency-name: near-sys
      - dependency-name: near-workspaces
    groups:
      cargo-lockfile:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
