name: App CI + Web4 Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/deploy-crust.mjs'
      - 'scripts/deploy-web4.sh'
      - '.github/workflows/app-web4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/deploy-crust.mjs'
      - 'scripts/deploy-web4.sh'
      - '.github/workflows/app-web4.yml'
  workflow_dispatch:
    inputs:
      deploy_web4:
        description: 'Deploy current main to Web4 mainnet'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-web4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    name: App Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Build app (server target)
        run: npm run build
        working-directory: apps/web
      - name: Build app (web4 target)
        run: npm run build:web4
        working-directory: apps/web

  deploy-web4:
    name: Deploy Web4 to Mainnet
    needs: app-ci
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_web4 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: web4-mainnet
      url: https://youtick.near.page/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Install near-cli-rs
        run: npm install -g near-cli-rs@0.22.2
      - name: Prepare NEAR mainnet access key
        env:
          NEAR_MAINNET_ACCESS_KEY_JSON: ${{ secrets.NEAR_MAINNET_ACCESS_KEY_JSON }}
        run: |
          if [ -z "${NEAR_MAINNET_ACCESS_KEY_JSON:-}" ]; then
            echo "Missing secret: NEAR_MAINNET_ACCESS_KEY_JSON" >&2
            exit 1
          fi
          mkdir -p "$HOME/.near-credentials/mainnet"
          printf '%s' "$NEAR_MAINNET_ACCESS_KEY_JSON" > "$HOME/.near-credentials/mainnet/youtick.near.json"
          jq -e '.account_id and (.private_key or .secret_key)' "$HOME/.near-credentials/mainnet/youtick.near.json" >/dev/null
      - name: Build + upload + update Web4 URL
        run: node scripts/deploy-crust.mjs --set-url
