name: Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-preview
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read

env:
  PREVIEW_NEXT_PUBLIC_NEAR_NETWORK: ${{ vars.PREVIEW_NEXT_PUBLIC_NEAR_NETWORK }}
  PREVIEW_NEXT_PUBLIC_MARKET_CONTRACT_ID: ${{ vars.PREVIEW_NEXT_PUBLIC_MARKET_CONTRACT_ID }}
  PREVIEW_NEXT_PUBLIC_ACCESS_CONTRACT_ID: ${{ vars.PREVIEW_NEXT_PUBLIC_ACCESS_CONTRACT_ID }}
  PREVIEW_NEXT_PUBLIC_APP_URL: ${{ vars.PREVIEW_NEXT_PUBLIC_APP_URL }}
  PREVIEW_NEXT_PUBLIC_LIVEPEER_BRIDGE_URL: ${{ vars.PREVIEW_NEXT_PUBLIC_LIVEPEER_BRIDGE_URL }}
  PREVIEW_NEXT_PUBLIC_ENABLE_PAID_MEDIA_LIVEPEER_V1: ${{ (vars.PREVIEW_MULTI_CREATOR_UPLOAD_CANARY_ENABLED == 'true' || vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED == 'true') && 'true' || 'false' }}
  PREVIEW_NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE: ${{ vars.PREVIEW_NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE }}
  PREVIEW_NEXT_PUBLIC_ENABLE_SPONSORED_LIVEPEER_UPLOADS: ${{ vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED || 'false' }}
  PREVIEW_NEXT_PUBLIC_ENABLE_PLAYBACK_AUTHORIZER_V2: "false"
  PREVIEW_NEXT_PUBLIC_ENABLE_PLAYBACK_SHADOW_V2: "false"
  PREVIEW_NEXT_PUBLIC_ENABLE_DERIVED_READ_MODEL: ${{ vars.PREVIEW_NEXT_PUBLIC_ENABLE_DERIVED_READ_MODEL }}
  PREVIEW_NEXT_PUBLIC_MARKET_READ_MODEL_URL: ${{ vars.PREVIEW_NEXT_PUBLIC_MARKET_READ_MODEL_URL }}
  PREVIEW_NEXT_PUBLIC_MULTI_ASSET_PAYMENTS_MODE: ${{ vars.PREVIEW_NEXT_PUBLIC_MULTI_ASSET_PAYMENTS_MODE }}
  PREVIEW_NEXT_PUBLIC_USDC_CONTRACT_ID: ${{ vars.PREVIEW_NEXT_PUBLIC_USDC_CONTRACT_ID }}
  PREVIEW_NEXT_PUBLIC_LIVEPEER_CREATOR_FEE_GAS_RESERVE_YOCTO: ${{ vars.PREVIEW_NEXT_PUBLIC_LIVEPEER_CREATOR_FEE_GAS_RESERVE_YOCTO }}
  PREVIEW_NEXT_PUBLIC_PAYMENT_GAS_RESERVE_YOCTO: ${{ vars.PREVIEW_NEXT_PUBLIC_PAYMENT_GAS_RESERVE_YOCTO }}
  PREVIEW_ALLOWED_ORIGINS: ${{ vars.PREVIEW_ALLOWED_ORIGINS }}
  PREVIEW_NEAR_NETWORK: ${{ vars.PREVIEW_NEAR_NETWORK }}
  PREVIEW_MARKET_CONTRACT_ID: ${{ vars.PREVIEW_MARKET_CONTRACT_ID }}
  PREVIEW_ACCESS_CONTRACT_ID: ${{ vars.PREVIEW_ACCESS_CONTRACT_ID }}
  PREVIEW_LIVEPEER_PROJECT_ID: ${{ vars.PREVIEW_LIVEPEER_PROJECT_ID }}
  PREVIEW_LIVEPEER_API_TOKEN_NAME: ${{ vars.PREVIEW_LIVEPEER_API_TOKEN_NAME }}
  PREVIEW_LIVEPEER_CREATOR_ALLOWLIST: ${{ vars.PREVIEW_LIVEPEER_CREATOR_ALLOWLIST }}
  PREVIEW_LIVEPEER_MONTHLY_OPERATION_BUDGET_USD_MICROS: ${{ vars.PREVIEW_LIVEPEER_MONTHLY_OPERATION_BUDGET_USD_MICROS }}
  PREVIEW_LIVEPEER_JOB_OPERATION_RESERVATION_USD_MICROS: ${{ vars.PREVIEW_LIVEPEER_JOB_OPERATION_RESERVATION_USD_MICROS }}
  PREVIEW_LIVEPEER_PAID_MEDIA_OPERATOR_ID: ${{ vars.PREVIEW_LIVEPEER_PAID_MEDIA_OPERATOR_ID }}
  PREVIEW_LIVEPEER_JWT_PUBLIC_KEY: ${{ vars.PREVIEW_LIVEPEER_JWT_PUBLIC_KEY }}
  PREVIEW_LIVEPEER_JWT_ISSUER: ${{ vars.PREVIEW_LIVEPEER_JWT_ISSUER }}
  PREVIEW_NEAR_OPERATOR_ACCOUNT_ID: ${{ vars.PREVIEW_NEAR_OPERATOR_ACCOUNT_ID }}
  PREVIEW_NEAR_OPERATOR_KEY_EPOCH: ${{ vars.PREVIEW_NEAR_OPERATOR_KEY_EPOCH }}
  PREVIEW_NEAR_SPONSOR_RELAYER_ACCOUNT_ID: ${{ vars.PREVIEW_NEAR_SPONSOR_RELAYER_ACCOUNT_ID }}
  PREVIEW_NEAR_SPONSOR_RELAYER_KEY_EPOCH: ${{ vars.PREVIEW_NEAR_SPONSOR_RELAYER_KEY_EPOCH }}
  PREVIEW_CREATOR_FEE_QUOTE_KEY_VERSION: ${{ vars.PREVIEW_CREATOR_FEE_QUOTE_KEY_VERSION }}
  PREVIEW_LIVEPEER_BRIDGE_ENABLED: ${{ (vars.PREVIEW_MULTI_CREATOR_UPLOAD_CANARY_ENABLED == 'true' || vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED == 'true') && 'true' || 'false' }}
  PREVIEW_LIVEPEER_NEW_UPLOADS_ENABLED: ${{ (vars.PREVIEW_MULTI_CREATOR_UPLOAD_CANARY_ENABLED == 'true' || vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED == 'true') && 'true' || 'false' }}
  PREVIEW_LIVEPEER_PLAYBACK_ISSUANCE_ENABLED: "false"
  PREVIEW_LIVEPEER_PLAYBACK_V2_ENABLED: "false"
  PREVIEW_LIVEPEER_PLAYBACK_SHADOW_V2_ENABLED: "false"
  PREVIEW_LIVEPEER_WEBHOOK_QUEUE_ENABLED: "false"
  PREVIEW_LIVEPEER_PROVIDER_MUTATIONS_ENABLED: ${{ (vars.PREVIEW_MULTI_CREATOR_UPLOAD_CANARY_ENABLED == 'true' || vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED == 'true') && 'true' || 'false' }}
  PREVIEW_LIVEPEER_OPERATOR_MUTATIONS_ENABLED: ${{ vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED == 'true' && 'true' || 'false' }}
  PREVIEW_LIVEPEER_OPERATOR_JOB_ID: ${{ vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED == 'true' && vars.PREVIEW_LIVEPEER_OPERATOR_JOB_ID || '' }}
  PREVIEW_UPLOAD_JOB_ARCHIVE_ENABLED: "false"
  PREVIEW_OPERATOR_OUTBOX_ARCHIVE_ENABLED: ${{ vars.PREVIEW_OPERATOR_OUTBOX_ARCHIVE_ENABLED }}
  PREVIEW_LIVEPEER_NEAR_CREATOR_FEE_ENABLED: ${{ vars.PREVIEW_LIVEPEER_NEAR_CREATOR_FEE_ENABLED }}
  PREVIEW_LIVEPEER_SPONSORED_UPLOADS_ENABLED: ${{ vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED || 'false' }}
  PREVIEW_LIVEPEER_SPONSOR_RELAYER_MUTATIONS_ENABLED: ${{ vars.PREVIEW_SPONSORED_UPLOAD_CANARY_ENABLED || 'false' }}
  PREVIEW_MULTI_ASSET_PAYMENTS_MODE: ${{ vars.PREVIEW_MULTI_ASSET_PAYMENTS_MODE }}
  PREVIEW_MULTI_ASSET_PAYMENT_ASSET_IDS: ${{ vars.PREVIEW_MULTI_ASSET_PAYMENT_ASSET_IDS }}
  PRODUCTION_NEXT_PUBLIC_NEAR_NETWORK: ${{ vars.PRODUCTION_NEXT_PUBLIC_NEAR_NETWORK }}
  PRODUCTION_NEXT_PUBLIC_MARKET_CONTRACT_ID: ${{ vars.PRODUCTION_NEXT_PUBLIC_MARKET_CONTRACT_ID }}
  PRODUCTION_NEXT_PUBLIC_ACCESS_CONTRACT_ID: ${{ vars.PRODUCTION_NEXT_PUBLIC_ACCESS_CONTRACT_ID }}
  PRODUCTION_NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_NEXT_PUBLIC_APP_URL }}
  PRODUCTION_NEXT_PUBLIC_LIVEPEER_BRIDGE_URL: ${{ vars.PRODUCTION_NEXT_PUBLIC_LIVEPEER_BRIDGE_URL }}
  PRODUCTION_NEXT_PUBLIC_ENABLE_PAID_MEDIA_LIVEPEER_V1: ${{ vars.PRODUCTION_NEXT_PUBLIC_ENABLE_PAID_MEDIA_LIVEPEER_V1 }}
  PRODUCTION_NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE: ${{ vars.PRODUCTION_NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE }}
  PRODUCTION_NEXT_PUBLIC_ENABLE_SPONSORED_LIVEPEER_UPLOADS: "false"
  PRODUCTION_NEXT_PUBLIC_ENABLE_PLAYBACK_AUTHORIZER_V2: "false"
  PRODUCTION_NEXT_PUBLIC_ENABLE_PLAYBACK_SHADOW_V2: "false"
  PRODUCTION_NEXT_PUBLIC_ENABLE_DERIVED_READ_MODEL: "false"
  PRODUCTION_NEXT_PUBLIC_MULTI_ASSET_PAYMENTS_MODE: ${{ vars.PRODUCTION_NEXT_PUBLIC_MULTI_ASSET_PAYMENTS_MODE }}
  PRODUCTION_NEXT_PUBLIC_USDC_CONTRACT_ID: ${{ vars.PRODUCTION_NEXT_PUBLIC_USDC_CONTRACT_ID }}
  PRODUCTION_NEXT_PUBLIC_LIVEPEER_CREATOR_FEE_GAS_RESERVE_YOCTO: ${{ vars.PRODUCTION_NEXT_PUBLIC_LIVEPEER_CREATOR_FEE_GAS_RESERVE_YOCTO }}
  PRODUCTION_NEXT_PUBLIC_PAYMENT_GAS_RESERVE_YOCTO: ${{ vars.PRODUCTION_NEXT_PUBLIC_PAYMENT_GAS_RESERVE_YOCTO }}
  PRODUCTION_ALLOWED_ORIGINS: ${{ vars.PRODUCTION_ALLOWED_ORIGINS }}
  PRODUCTION_NEAR_NETWORK: ${{ vars.PRODUCTION_NEAR_NETWORK }}
  PRODUCTION_MARKET_CONTRACT_ID: ${{ vars.PRODUCTION_MARKET_CONTRACT_ID }}
  PRODUCTION_ACCESS_CONTRACT_ID: ${{ vars.PRODUCTION_ACCESS_CONTRACT_ID }}
  PRODUCTION_LIVEPEER_PROJECT_ID: ${{ vars.PRODUCTION_LIVEPEER_PROJECT_ID }}
  PRODUCTION_LIVEPEER_API_TOKEN_NAME: ${{ vars.PRODUCTION_LIVEPEER_API_TOKEN_NAME }}
  PRODUCTION_LIVEPEER_CREATOR_ALLOWLIST: ${{ vars.PRODUCTION_LIVEPEER_CREATOR_ALLOWLIST }}
  PRODUCTION_LIVEPEER_MONTHLY_OPERATION_BUDGET_USD_MICROS: ${{ vars.PRODUCTION_LIVEPEER_MONTHLY_OPERATION_BUDGET_USD_MICROS }}
  PRODUCTION_LIVEPEER_JOB_OPERATION_RESERVATION_USD_MICROS: ${{ vars.PRODUCTION_LIVEPEER_JOB_OPERATION_RESERVATION_USD_MICROS }}
  PRODUCTION_LIVEPEER_PAID_MEDIA_OPERATOR_ID: ${{ vars.PRODUCTION_LIVEPEER_PAID_MEDIA_OPERATOR_ID }}
  PRODUCTION_LIVEPEER_JWT_PUBLIC_KEY: ${{ vars.PRODUCTION_LIVEPEER_JWT_PUBLIC_KEY }}
  PRODUCTION_LIVEPEER_JWT_ISSUER: ${{ vars.PRODUCTION_LIVEPEER_JWT_ISSUER }}
  PRODUCTION_NEAR_OPERATOR_ACCOUNT_ID: ${{ vars.PRODUCTION_NEAR_OPERATOR_ACCOUNT_ID }}
  PRODUCTION_NEAR_OPERATOR_KEY_EPOCH: ${{ vars.PRODUCTION_NEAR_OPERATOR_KEY_EPOCH }}
  PRODUCTION_NEAR_SPONSOR_RELAYER_ACCOUNT_ID: ""
  PRODUCTION_NEAR_SPONSOR_RELAYER_KEY_EPOCH: ""
  PRODUCTION_CREATOR_FEE_QUOTE_KEY_VERSION: ${{ vars.PRODUCTION_CREATOR_FEE_QUOTE_KEY_VERSION }}
  PRODUCTION_LIVEPEER_BRIDGE_ENABLED: ${{ vars.PRODUCTION_LIVEPEER_BRIDGE_ENABLED }}
  PRODUCTION_LIVEPEER_NEW_UPLOADS_ENABLED: "false"
  PRODUCTION_LIVEPEER_PLAYBACK_ISSUANCE_ENABLED: "false"
  PRODUCTION_LIVEPEER_PLAYBACK_V2_ENABLED: "false"
  PRODUCTION_LIVEPEER_PLAYBACK_SHADOW_V2_ENABLED: "false"
  PRODUCTION_LIVEPEER_WEBHOOK_QUEUE_ENABLED: "false"
  PRODUCTION_LIVEPEER_PROVIDER_MUTATIONS_ENABLED: "false"
  PRODUCTION_LIVEPEER_OPERATOR_MUTATIONS_ENABLED: "false"
  PRODUCTION_LIVEPEER_OPERATOR_JOB_ID: ""
  PRODUCTION_UPLOAD_JOB_ARCHIVE_ENABLED: "false"
  PRODUCTION_OPERATOR_OUTBOX_ARCHIVE_ENABLED: "false"
  PRODUCTION_LIVEPEER_NEAR_CREATOR_FEE_ENABLED: ${{ vars.PRODUCTION_LIVEPEER_NEAR_CREATOR_FEE_ENABLED }}
  PRODUCTION_LIVEPEER_SPONSORED_UPLOADS_ENABLED: "false"
  PRODUCTION_LIVEPEER_SPONSOR_RELAYER_MUTATIONS_ENABLED: "false"
  PRODUCTION_MULTI_ASSET_PAYMENTS_MODE: ${{ vars.PRODUCTION_MULTI_ASSET_PAYMENTS_MODE }}
  PRODUCTION_MULTI_ASSET_PAYMENT_ASSET_IDS: ${{ vars.PRODUCTION_MULTI_ASSET_PAYMENT_ASSET_IDS }}

jobs:
  authorize:
    name: Authorize current main
    if: >
      vars.DEPLOY_PREVIEW_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.authorize.outputs.deploy }}
      sha: ${{ steps.authorize.outputs.sha }}
      ci_run_id: ${{ steps.authorize.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.authorize.outputs.ci_run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: authorize
        name: Verify CI provenance and cumulative release changes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e \
            --arg sha "${SHA}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '.conclusion == "success"
              and .event == "push"
              and .head_branch == "main"
              and .head_sha == $sha
              and .head_repository.full_name == $repo
              and .path == ".github/workflows/ci.yml"' \
            <<< "${run_json}" > /dev/null

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?filter=latest&per_page=100")"
          jq -e \
            '[.jobs[] | select(.name == "CI Gate" and .conclusion == "success")] | length == 1' \
            <<< "${jobs_json}" > /dev/null

          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "${SHA}" ]]
          if [[ "$(git rev-parse origin/main)" != "${SHA}" ]]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale Preview SHA ${SHA}."
            exit 0
          fi

          artifact_pages="${RUNNER_TEMP}/repository-artifacts.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > "${artifact_pages}"
          jq -e 'all(.[]; (.artifacts | type == "array"))' "${artifact_pages}" > /dev/null

          baseline=""
          while IFS=$'\t' read -r candidate_name candidate_run_id candidate_head_sha; do
            if [[ ! "${candidate_name}" =~ ^preview-deployment-([0-9a-f]{40})$ ]]; then
              continue
            fi
            candidate_sha="${BASH_REMATCH[1]}"
            if [[ ! "${candidate_run_id}" =~ ^[1-9][0-9]*$ ]] \
              || [[ "${candidate_head_sha}" != "${candidate_sha}" ]] \
              || ! git cat-file -e "${candidate_sha}^{commit}" 2>/dev/null \
              || ! git merge-base --is-ancestor "${candidate_sha}" "${SHA}"; then
              continue
            fi

            if ! candidate_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}" 2>/dev/null)"; then
              continue
            fi
            if ! jq -e \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${candidate_sha}" \
              --argjson run_id "${candidate_run_id}" \
              '.id == $run_id
                and .conclusion == "success"
                and .event == "workflow_run"
                and .head_branch == "main"
                and .head_sha == $sha
                and .head_repository.full_name == $repo
                and .path == ".github/workflows/deploy-preview.yml"' \
              <<< "${candidate_run_json}" > /dev/null; then
              continue
            fi

            baseline="${candidate_sha}"
            break
          done < <(
            jq -r '
              [.[] | .artifacts[]
                | select(.expired == false)
                | select((.name | type) == "string")
                | select(.name | test("^preview-deployment-[0-9a-f]{40}$"))
                | select((.created_at | type) == "string")
                | select((.workflow_run.id | type) == "number")
                | select((.workflow_run.head_sha | type) == "string")]
              | sort_by(.created_at)
              | reverse[]
              | [.name, (.workflow_run.id | tostring), .workflow_run.head_sha]
              | @tsv' \
              "${artifact_pages}"
          )

          deploy=false
          if [[ "${PREVIEW_LIVEPEER_BRIDGE_ENABLED}" == "true" ]]; then
            deploy=true
            echo "Preview Livepeer canary enabled; building current main ${SHA}."
          elif [[ "${baseline}" == "${SHA}" ]] \
            && [[ "${PREVIEW_OPERATOR_OUTBOX_ARCHIVE_ENABLED}" == "false" ]]; then
            deploy=true
            echo "Explicit closed Preview redeploy requested for current main ${SHA}."
          elif [[ -z "${baseline}" ]]; then
            deploy=true
            echo "No trusted Preview baseline found; building current main ${SHA}."
          else
            changed_file="${RUNNER_TEMP}/release-changes"
            git diff --name-only -z "${baseline}" "${SHA}" > "${changed_file}"
            while IFS= read -r -d '' path; do
              case "${path}" in
                apps/web/*|workers/livepeer-bridge/*|read-model/*|protocol/paid-media-livepeer-v1/*|scripts/check-paid-media-livepeer-v1.mjs|.nvmrc|.github/workflows/*)
                  deploy=true
                  break
                  ;;
                contracts/*|scripts/check-paid-media-livepeer-v1-abi.mjs|docs/*)
                  ;;
                *)
                  deploy=true
                  break
                  ;;
              esac
            done < "${changed_file}"
            echo "Trusted Preview baseline ${baseline}; deploy-relevant changes: ${deploy}."
          fi

          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"
          if [[ "${deploy}" != "true" ]]; then
            exit 0
          fi

          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "ci_run_id=${CI_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "ci_run_attempt=$(jq -r .run_attempt <<< "${run_json}")" >> "${GITHUB_OUTPUT}"

  build-web:
    name: Build Web (${{ matrix.target }})
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: preview
          - target: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - name: Generate Web runtime SBOM
        working-directory: apps/web
        run: npm sbom --omit=dev --sbom-format=spdx > "${RUNNER_TEMP}/web.spdx.json"
      - name: Validate and export canonical Web config
        run: |
          config="${RUNNER_TEMP}/${{ matrix.target }}-config.json"
          node scripts/release-metadata.mjs config \
            --environment "${{ matrix.target }}" \
            --output "${config}"
          jq -r '.web | to_entries[] | "\(.key)=\(.value)"' "${config}" >> "${GITHUB_ENV}"
      - name: Build OpenNext bundle
        working-directory: apps/web
        run: npm run build:cloudflare -- --env "${{ matrix.target }}"
      - name: Pack exact Web bundle
        run: |
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --create \
            --file=- \
            --directory=apps/web \
            .open-next wrangler.jsonc \
            | gzip -n > "${RUNNER_TEMP}/web-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ matrix.target }}-${{ needs.authorize.outputs.sha }}
          path: |
            ${{ runner.temp }}/web-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/${{ matrix.target }}-config.json
            ${{ runner.temp }}/web.spdx.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  build-bridge:
    name: Build Bridge bundle
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/livepeer-bridge/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: workers/livepeer-bridge
      - name: Generate Bridge runtime SBOM
        working-directory: workers/livepeer-bridge
        run: npm sbom --omit=dev --sbom-format=spdx > "${RUNNER_TEMP}/bridge.spdx.json"
      - name: Build one prebuilt Bridge module
        working-directory: workers/livepeer-bridge
        run: >
          npx --no-install wrangler deploy
          --dry-run
          --outdir "${RUNNER_TEMP}/bridge-output"
          --metafile "${RUNNER_TEMP}/bridge-output/metafile.json"
      - name: Pack exact Bridge bundle
        run: |
          node scripts/cloudflare-release.mjs write-bridge-wrangler \
            "${RUNNER_TEMP}/bridge-output/wrangler.toml"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --create \
            --file=- \
            --directory="${RUNNER_TEMP}/bridge-output" \
            index.js wrangler.toml \
            | gzip -n > "${RUNNER_TEMP}/bridge.tar.gz"
      - name: Build and pack dark read-model bundle
        run: |
          workers/livepeer-bridge/node_modules/.bin/wrangler deploy \
            --dry-run \
            --cwd read-model \
            --outdir "${RUNNER_TEMP}/read-model-output"
          node scripts/cloudflare-release.mjs write-read-model-wrangler \
            "${RUNNER_TEMP}/read-model-output/wrangler.toml"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --create \
            --file=- \
            --directory="${RUNNER_TEMP}/read-model-output" \
            worker.js wrangler.toml \
            | gzip -n > "${RUNNER_TEMP}/read-model.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-${{ needs.authorize.outputs.sha }}
          path: |
            ${{ runner.temp }}/bridge.tar.gz
            ${{ runner.temp }}/read-model.tar.gz
            ${{ runner.temp }}/bridge.spdx.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  assemble:
    name: Assemble release artifact
    needs:
      - authorize
      - build-web
      - build-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-preview-${{ needs.authorize.outputs.sha }}
          path: ${{ runner.temp }}/components/preview
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-production-${{ needs.authorize.outputs.sha }}
          path: ${{ runner.temp }}/components/production
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bridge-${{ needs.authorize.outputs.sha }}
          path: ${{ runner.temp }}/components/bridge
      - name: Create and verify manifest
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          cp "${RUNNER_TEMP}/components/preview/web-preview.tar.gz" "${RUNNER_TEMP}/release/web-preview.tar.gz"
          cp "${RUNNER_TEMP}/components/preview/preview-config.json" "${RUNNER_TEMP}/release/preview-config.json"
          cp "${RUNNER_TEMP}/components/production/web-production.tar.gz" "${RUNNER_TEMP}/release/web-production.tar.gz"
          cp "${RUNNER_TEMP}/components/production/production-config.json" "${RUNNER_TEMP}/release/production-config.json"
          cp "${RUNNER_TEMP}/components/bridge/bridge.tar.gz" "${RUNNER_TEMP}/release/bridge.tar.gz"
          cp "${RUNNER_TEMP}/components/bridge/read-model.tar.gz" "${RUNNER_TEMP}/release/read-model.tar.gz"

          node scripts/release-metadata.mjs manifest \
            --sha "${{ needs.authorize.outputs.sha }}" \
            --run-id "${{ needs.authorize.outputs.ci_run_id }}" \
            --run-attempt "${{ needs.authorize.outputs.ci_run_attempt }}" \
            --web-lock apps/web/package-lock.json \
            --bridge-lock workers/livepeer-bridge/package-lock.json \
            --web-preview "${RUNNER_TEMP}/release/web-preview.tar.gz" \
            --web-production "${RUNNER_TEMP}/release/web-production.tar.gz" \
            --bridge "${RUNNER_TEMP}/release/bridge.tar.gz" \
            --read-model "${RUNNER_TEMP}/release/read-model.tar.gz" \
            --preview-config "${RUNNER_TEMP}/release/preview-config.json" \
            --production-config "${RUNNER_TEMP}/release/production-config.json" \
            --output-dir "${RUNNER_TEMP}/release"

          node scripts/release-metadata.mjs verify \
            --artifact-dir "${RUNNER_TEMP}/release" \
            --sha "${{ needs.authorize.outputs.sha }}" \
            --web-lock apps/web/package-lock.json \
            --bridge-lock workers/livepeer-bridge/package-lock.json
          (cd "${RUNNER_TEMP}/release" && sha256sum --check SHA256SUMS)
      - name: Attest exact release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Attest Web runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/web-preview.tar.gz
            ${{ runner.temp }}/release/web-production.tar.gz
          sbom-path: ${{ runner.temp }}/components/preview/web.spdx.json
      - name: Attest Bridge runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/bridge.tar.gz
          sbom-path: ${{ runner.temp }}/components/bridge/bridge.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.authorize.outputs.sha }}
          path: ${{ runner.temp }}/release
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    needs:
      - authorize
      - assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
      url: https://preview.youtick.net
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - id: current
        name: Skip stale SHA before Cloudflare
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" == "${SHA}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale Preview SHA ${SHA}."
          fi
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.current.outputs.deploy == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.authorize.outputs.sha }}
          path: ${{ runner.temp }}/release
      - if: steps.current.outputs.deploy == 'true'
        name: Verify bytes and Preview config drift
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          node scripts/release-metadata.mjs verify \
            --artifact-dir "${RUNNER_TEMP}/release" \
            --sha "${SHA}" \
            --web-lock apps/web/package-lock.json \
            --bridge-lock workers/livepeer-bridge/package-lock.json
          node scripts/release-metadata.mjs config \
            --environment preview \
            --output "${RUNNER_TEMP}/current-preview-config.json"
          cmp "${RUNNER_TEMP}/release/preview-config.json" "${RUNNER_TEMP}/current-preview-config.json"
      - if: steps.current.outputs.deploy == 'true'
        name: Record unchanged root origin
        run: node scripts/release-smoke.mjs fingerprint https://youtick.net > "${RUNNER_TEMP}/root-before.json"
      - if: steps.current.outputs.deploy == 'true'
        name: Upload, smoke and promote Preview versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          NEAR_RPC_URL: ${{ secrets.NEAR_RPC_URL }}
          ONECLICK_API_KEY: ${{ secrets.ONECLICK_API_KEY }}
          LIVEPEER_API_KEY: ${{ secrets.PREVIEW_LIVEPEER_API_KEY }}
          LIVEPEER_WEBHOOK_SECRET: ${{ secrets.PREVIEW_LIVEPEER_WEBHOOK_SECRET }}
          LIVEPEER_JWT_PRIVATE_KEY: ${{ secrets.PREVIEW_LIVEPEER_JWT_PRIVATE_KEY }}
          LIVEPEER_PAID_MEDIA_OPERATOR_TOKEN: ${{ secrets.PREVIEW_LIVEPEER_PAID_MEDIA_OPERATOR_TOKEN }}
          NEAR_OPERATOR_PRIVATE_KEY: ${{ secrets.PREVIEW_NEAR_OPERATOR_PRIVATE_KEY }}
          CREATOR_FEE_QUOTE_PRIVATE_KEY: ${{ secrets.PREVIEW_CREATOR_FEE_QUOTE_PRIVATE_KEY }}
          NEAR_SPONSOR_RELAYER_PRIVATE_KEY: ${{ secrets.PREVIEW_NEAR_SPONSOR_RELAYER_PRIVATE_KEY }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${SHA}" ]]
          node scripts/cloudflare-release.mjs deploy preview "${SHA}" \
            "${RUNNER_TEMP}/release" \
            "${RUNNER_TEMP}/preview-deployment.json"
      - if: steps.current.outputs.deploy == 'true'
        name: Prove root origin stayed unchanged
        run: |
          node scripts/release-smoke.mjs fingerprint https://youtick.net > "${RUNNER_TEMP}/root-after.json"
          node scripts/release-smoke.mjs compare \
            "${RUNNER_TEMP}/root-before.json" \
            "${RUNNER_TEMP}/root-after.json"
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-deployment-${{ needs.authorize.outputs.sha }}
          path: |
            ${{ runner.temp }}/preview-deployment.json
            ${{ runner.temp }}/root-before.json
            ${{ runner.temp }}/root-after.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
