name: Deploy Youtick MVP

on:
  push:
    branches: [ main ] # Main branch'ine her push yapıldığında çalışır

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        # NEXT_PUBLIC_ değişkenleri build anı için gereklidir
        env:
          NEXT_PUBLIC_NEAR_NETWORK: ${{ secrets.NEXT_PUBLIC_NEAR_NETWORK }}
          NEXT_PUBLIC_NFT_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_NFT_CONTRACT_ID }}
        run: |
          cd apps/web
          npm install
          npm run build

      - name: Deploy to Oracle via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Sadece çalışma anında lazım olan dosyaları gönderiyoruz
          # apps/web altındaki dosyaları hedefliyoruz
          source: "apps/web/.next/,apps/web/public/,apps/web/package.json,apps/web/next.config.ts,apps/web/package-lock.json"
          target: "~/youtick-mvp"
          rm: false # Sunucudaki .env dosyasını silmemesi için false

      - name: Finalize and Restart on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/youtick-mvp/apps/web
            # Uygulama bağımlılıklarını kur
            npm install --production
            
            # Uygulamayı restart et (Eğer daha önce başlamadıysa başlat)
            pm2 restart youtick || pm2 start npm --name "youtick" -- start
