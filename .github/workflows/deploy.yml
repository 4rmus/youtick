name: Deploy Youtick MVP

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Public vars (Updated for current config)
  NEXT_PUBLIC_NEAR_NETWORK: mainnet
  NEXT_PUBLIC_NFT_CONTRACT_ID: youtick.near

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install & Build
        run: |
          cd apps/web
          npm install
          npm run build
        env:
          # Build time secrets
          RELAYER_ACCOUNT_ID: ${{ secrets.RELAYER_ACCOUNT_ID }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}

      - name: Deploy to Oracle via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Sadece çalışma anında lazım olan dosyaları gönderiyoruz
          source: "apps/web/.next/,apps/web/public/,apps/web/package.json,apps/web/next.config.ts,apps/web/package-lock.json"
          target: "~/youtick-mvp"
          strip_components: 0
          rm: false 

      - name: Finalize and Restart on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Load environment variables (Node, PM2 path)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:$HOME/.npm-global/bin
            
            cd ~/youtick-mvp/apps/web
            
            # .env.local dosyasını oluştur (Secrets kullanarak)
            echo "Creating .env.local..."
            cat <<EOF > .env.local
            NEXT_PUBLIC_NEAR_NETWORK=mainnet
            NEXT_PUBLIC_NFT_CONTRACT_ID=youtick.near
            RELAYER_ACCOUNT_ID=${{ secrets.RELAYER_ACCOUNT_ID }}
            RELAYER_PRIVATE_KEY=${{ secrets.RELAYER_PRIVATE_KEY }}
            EOF
            
            # Uygulama bağımlılıklarını kur
            npm install --production
            
            # Uygulamayı restart et (Eski yöntem)
            pm2 restart youtick || pm2 start npm --name "youtick" -- start
