name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Reject high-severity runtime dependency advisories
        run: |
          npm --prefix apps/web audit --omit=dev --audit-level=high
          npm --prefix workers/livepeer-bridge audit --omit=dev --audit-level=high
          npm --prefix docs audit --omit=dev --audit-level=high

  rust-wasm-audit:
    name: Production WASM Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install pinned cargo-audit binary
        env:
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          archive="${RUNNER_TEMP}/cargo-audit.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz \
            --output "${archive}"
          echo "${CARGO_AUDIT_SHA256} *${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          install \
            "${RUNNER_TEMP}/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" \
            "${HOME}/.cargo/bin/cargo-audit"
      - name: Audit and inventory production WASM graphs
        run: |
          mkdir -p "${RUNNER_TEMP}/contract-sboms"
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          for contract in nft-ticket access-control; do
            audit_json="${RUNNER_TEMP}/${contract}-audit.json"
            metadata="${RUNNER_TEMP}/${contract}-metadata.json"
            packages="${RUNNER_TEMP}/${contract}-wasm-packages.txt"
            cargo audit --json --file "contracts/${contract}/Cargo.lock" > "${audit_json}" || true
            cargo metadata \
              --manifest-path "contracts/${contract}/Cargo.toml" \
              --locked \
              --format-version 1 \
              --filter-platform wasm32-unknown-unknown > "${metadata}"
            cargo tree \
              --manifest-path "contracts/${contract}/Cargo.toml" \
              --locked \
              --target wasm32-unknown-unknown \
              --edges normal \
              --prefix none \
              --format '{p}' > "${packages}"
            node scripts/check-rust-wasm-advisories.mjs \
              --audit-json "${audit_json}" \
              --packages "${packages}" \
              --label "${contract}"
            node scripts/generate-contract-spdx.mjs \
              --metadata "${metadata}" \
              --packages "${packages}" \
              --name "youtick-${contract}-wasm" \
              --namespace "https://github.com/${GITHUB_REPOSITORY}/sbom/${GITHUB_SHA}/${contract}" \
              --created "${created}" \
              --output "${RUNNER_TEMP}/contract-sboms/${contract}.spdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/contract-sboms
          retention-days: 30
          if-no-files-found: error

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changes.outputs.web }}
      bridge: ${{ steps.changes.outputs.bridge }}
      contracts: ${{ steps.changes.outputs.contracts }}
      protocol: ${{ steps.changes.outputs.protocol }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: changes
        name: Map changed paths to CI jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          web=false
          bridge=false
          contracts=false
          protocol=false
          docs=false

          set_all() {
            web=true
            bridge=true
            contracts=true
            protocol=true
            docs=true
          }

          changed_file="${RUNNER_TEMP}/changed-files"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            || ! git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_file}"; then
            set_all
          else
            found_change=false
            while IFS= read -r -d '' path; do
              found_change=true
              case "${path}" in
                apps/web/*)
                  web=true
                  ;;
                workers/livepeer-bridge/*)
                  bridge=true
                  ;;
                protocol/paid-media-livepeer-v1/*|scripts/check-paid-media-livepeer-v1.mjs)
                  protocol=true
                  bridge=true
                  ;;
                contracts/*|scripts/check-paid-media-livepeer-v1-abi.mjs)
                  contracts=true
                  ;;
                docs/*)
                  docs=true
                  ;;
                .nvmrc)
                  web=true
                  bridge=true
                  protocol=true
                  docs=true
                  ;;
                scripts/cloudflare-release.mjs|scripts/cloudflare-release.test.mjs|scripts/release-metadata.mjs|scripts/release-metadata.test.mjs|scripts/release-smoke.mjs|scripts/release-smoke.test.mjs)
                  : # Release tooling is tested by the required CI Gate.
                  ;;
                .github/workflows/*)
                  set_all
                  ;;
                *)
                  set_all
                  ;;
              esac
            done < "${changed_file}"

            if [[ "${found_change}" = false ]]; then
              set_all
            fi
          fi

          {
            echo "web=${web}"
            echo "bridge=${bridge}"
            echo "contracts=${contracts}"
            echo "protocol=${protocol}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    env:
      NEXT_PUBLIC_NEAR_NETWORK: testnet
      NEXT_PUBLIC_MARKET_CONTRACT_ID: market.testnet
      NEXT_PUBLIC_ACCESS_CONTRACT_ID: access.testnet
      NEXT_PUBLIC_ENABLE_PAID_MEDIA_LIVEPEER_V1: "false"
      NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE: "false"
      NEXT_PUBLIC_ENABLE_DERIVED_READ_MODEL: "false"
      NEXT_PUBLIC_MULTI_ASSET_PAYMENTS_MODE: "off"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:livepeer-canary
      - run: npm run build

  livepeer-bridge:
    name: Livepeer Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge == 'true'
    defaults:
      run:
        working-directory: workers/livepeer-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/livepeer-bridge/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm test -- --run
      - run: npm run test:provider-canary
      - run: npm run check
      - run: npx wrangler deploy --dry-run

  contracts:
    name: Contracts (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true'
    strategy:
      fail-fast: true
      matrix:
        task:
          - tests
          - quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Install Wasm target for sandbox tests
        if: matrix.task == 'tests'
        run: rustup target add wasm32-unknown-unknown
      - name: Test market
        if: matrix.task == 'tests'
        working-directory: contracts/nft-ticket
        run: |
          cargo test --lib
          cargo test --test paid_media_livepeer_v1
          cargo test --test sandbox
      - name: Test access control
        if: matrix.task == 'tests'
        working-directory: contracts/access-control
        run: cargo test
      - name: Check formatting
        if: matrix.task == 'quality'
        run: |
          (cd contracts/nft-ticket && cargo fmt --all --check)
          (cd contracts/access-control && cargo fmt --all --check)
      - name: Lint contracts
        if: matrix.task == 'quality'
        run: |
          (cd contracts/nft-ticket && cargo clippy --all-targets -- -D warnings)
          (cd contracts/access-control && cargo clippy --all-targets)
      - name: Install Wasm target for ABI builds
        if: matrix.task == 'quality'
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned cargo-near binary
        if: matrix.task == 'quality'
        env:
          CARGO_NEAR_SHA256: b6cdf1548ed598553dec52dbe9e50e1826537ba7e81a4f95bed5b869274170bc
        run: |
          archive="${RUNNER_TEMP}/cargo-near.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.17.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz \
            --output "${archive}"
          echo "${CARGO_NEAR_SHA256} *${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          install \
            "${RUNNER_TEMP}/cargo-near-x86_64-unknown-linux-gnu/cargo-near" \
            "${HOME}/.cargo/bin/cargo-near"
      - name: Build contract ABIs
        if: matrix.task == 'quality'
        run: |
          (cd contracts/nft-ticket && cargo near build non-reproducible-wasm)
          (cd contracts/access-control && cargo near build non-reproducible-wasm)
      - name: Check exact ABI
        if: matrix.task == 'quality'
        run: node scripts/check-paid-media-livepeer-v1-abi.mjs

  protocol:
    name: Livepeer Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-paid-media-livepeer-v1.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run build

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency-audit
      - rust-wasm-audit
      - detect-changes
      - web
      - livepeer-bridge
      - contracts
      - protocol
      - docs
      - codeql
    if: always()
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Check required CI results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "Required CI job finished with result: ${result}"
                exit 1
                ;;
            esac
          done
      - name: Test release tooling
        run: >
          node --test
          scripts/release-metadata.test.mjs
          scripts/release-smoke.test.mjs
          scripts/cloudflare-release.test.mjs
          scripts/ci-security.test.mjs
          scripts/apply-market-read-model-d1.test.mjs
          scripts/check-rust-wasm-advisories.test.mjs
          scripts/generate-contract-spdx.test.mjs
          scripts/slo-policy.test.mjs
