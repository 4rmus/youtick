name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changes.outputs.web }}
      bridge: ${{ steps.changes.outputs.bridge }}
      contracts: ${{ steps.changes.outputs.contracts }}
      protocol: ${{ steps.changes.outputs.protocol }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        name: Map changed paths to CI jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          web=false
          bridge=false
          contracts=false
          protocol=false
          docs=false

          set_all() {
            web=true
            bridge=true
            contracts=true
            protocol=true
            docs=true
          }

          changed_file="${RUNNER_TEMP}/changed-files"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            || ! git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_file}"; then
            set_all
          else
            found_change=false
            while IFS= read -r -d '' path; do
              found_change=true
              case "${path}" in
                apps/web/*)
                  web=true
                  ;;
                workers/livepeer-bridge/*)
                  bridge=true
                  ;;
                protocol/paid-media-livepeer-v1/*|scripts/check-paid-media-livepeer-v1.mjs)
                  protocol=true
                  bridge=true
                  ;;
                contracts/*|scripts/check-paid-media-livepeer-v1-abi.mjs)
                  contracts=true
                  ;;
                docs/*)
                  docs=true
                  ;;
                .nvmrc)
                  web=true
                  bridge=true
                  protocol=true
                  docs=true
                  ;;
                .github/workflows/*)
                  set_all
                  ;;
                *)
                  set_all
                  ;;
              esac
            done < "${changed_file}"

            if [[ "${found_change}" = false ]]; then
              set_all
            fi
          fi

          {
            echo "web=${web}"
            echo "bridge=${bridge}"
            echo "contracts=${contracts}"
            echo "protocol=${protocol}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    env:
      NEXT_PUBLIC_NEAR_NETWORK: testnet
      NEXT_PUBLIC_MARKET_CONTRACT_ID: market.testnet
      NEXT_PUBLIC_ACCESS_CONTRACT_ID: access.testnet
      NEXT_PUBLIC_ENABLE_PAID_MEDIA_LIVEPEER_V1: "false"
      NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE: "false"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:livepeer-canary
      - run: npm run build

  livepeer-bridge:
    name: Livepeer Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge == 'true'
    defaults:
      run:
        working-directory: workers/livepeer-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/livepeer-bridge/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm test -- --run
      - run: npm run test:provider-canary
      - run: npm run check
      - run: npx wrangler deploy --dry-run

  contracts:
    name: Contracts (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true'
    strategy:
      fail-fast: true
      matrix:
        task:
          - tests
          - quality
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Install Wasm target for sandbox tests
        if: matrix.task == 'tests'
        run: rustup target add wasm32-unknown-unknown
      - name: Test market
        if: matrix.task == 'tests'
        working-directory: contracts/nft-ticket
        run: |
          cargo test --lib
          cargo test --test paid_media_livepeer_v1
          cargo test --test sandbox
      - name: Test access control
        if: matrix.task == 'tests'
        working-directory: contracts/access-control
        run: cargo test
      - name: Check formatting
        if: matrix.task == 'quality'
        run: |
          (cd contracts/nft-ticket && cargo fmt --all --check)
          (cd contracts/access-control && cargo fmt --all --check)
      - name: Lint contracts
        if: matrix.task == 'quality'
        run: |
          (cd contracts/nft-ticket && cargo clippy --all-targets -- -D warnings)
          (cd contracts/access-control && cargo clippy --all-targets)
      - name: Install Wasm target for ABI builds
        if: matrix.task == 'quality'
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned cargo-near binary
        if: matrix.task == 'quality'
        env:
          CARGO_NEAR_SHA256: b6cdf1548ed598553dec52dbe9e50e1826537ba7e81a4f95bed5b869274170bc
        run: |
          archive="${RUNNER_TEMP}/cargo-near.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.17.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz \
            --output "${archive}"
          echo "${CARGO_NEAR_SHA256} *${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          install \
            "${RUNNER_TEMP}/cargo-near-x86_64-unknown-linux-gnu/cargo-near" \
            "${HOME}/.cargo/bin/cargo-near"
      - name: Build contract ABIs
        if: matrix.task == 'quality'
        run: |
          (cd contracts/nft-ticket && cargo near build non-reproducible-wasm)
          (cd contracts/access-control && cargo near build non-reproducible-wasm)
      - name: Check exact ABI
        if: matrix.task == 'quality'
        run: node scripts/check-paid-media-livepeer-v1-abi.mjs

  protocol:
    name: Livepeer Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.protocol == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-paid-media-livepeer-v1.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run build

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - web
      - livepeer-bridge
      - contracts
      - protocol
      - docs
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check required CI results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "Required CI job finished with result: ${result}"
                exit 1
                ;;
            esac
          done
      - name: Test release tooling
        run: >
          node --test
          scripts/release-metadata.test.mjs
          scripts/release-smoke.test.mjs
          scripts/cloudflare-release.test.mjs
