name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_NEAR_NETWORK: testnet
      NEXT_PUBLIC_MARKET_CONTRACT_ID: market.testnet
      NEXT_PUBLIC_ACCESS_CONTRACT_ID: access.testnet
      NEXT_PUBLIC_ENABLE_PAID_MEDIA_LIVEPEER_V1: "false"
      NEXT_PUBLIC_ENABLE_LIVEPEER_NEAR_CREATOR_FEE: "false"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  livepeer-bridge:
    name: Livepeer Bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/livepeer-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/livepeer-bridge/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run test:provider-canary
      - run: npm run check
      - run: npx wrangler deploy --dry-run

  contracts:
    name: Market and Access Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install cargo-near --version 0.17.0 --locked --no-default-features
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/nft-ticket/target
            contracts/access-control/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - name: Test market
        working-directory: contracts/nft-ticket
        run: |
          cargo test --lib
          cargo test --test paid_media_livepeer_v1
          cargo test --test sandbox
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
      - name: Test access control
        working-directory: contracts/access-control
        run: |
          cargo test
          cargo fmt --all --check
          cargo clippy --all-targets
      - name: Build contract ABIs
        run: |
          (cd contracts/nft-ticket && cargo near build non-reproducible-wasm)
          (cd contracts/access-control && cargo near build non-reproducible-wasm)
      - name: Check exact ABI
        run: node scripts/check-paid-media-livepeer-v1-abi.mjs

  protocol:
    name: Livepeer Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-paid-media-livepeer-v1.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - web
      - livepeer-bridge
      - contracts
      - protocol
      - docs
    if: always()
    steps:
      - name: Check required CI results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            test "${result}" = success
          done
