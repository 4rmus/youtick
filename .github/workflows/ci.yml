name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web-docs-workers:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            docs/package-lock.json
            workers/youtick-kms/package-lock.json
            workers/web4-proxy/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint web
        working-directory: apps/web
        run: npm run lint -- .

      - name: Test web
        working-directory: apps/web
        run: npm test -- --run

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Install KMS worker dependencies
        working-directory: workers/youtick-kms
        run: npm ci

      - name: Check KMS worker
        working-directory: workers/youtick-kms
        run: npm run check

      - name: Install Web4 proxy dependencies
        working-directory: workers/web4-proxy
        run: npm ci

      - name: Check Web4 proxy
        working-directory: workers/web4-proxy
        run: npm run check

  contracts:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/access-control
            contracts/operator-registry
            contracts/nft-ticket

      - name: Test access-control
        working-directory: contracts/access-control
        run: cargo test

      - name: Test operator-registry
        working-directory: contracts/operator-registry
        run: cargo test

      - name: Test nft-ticket
        working-directory: contracts/nft-ticket
        run: cargo test
