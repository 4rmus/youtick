name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-policy:
    name: Security and dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Dependency policy
        run: node scripts/check-dependency-policy.mjs

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      kms: ${{ steps.filter.outputs.kms }}
      web4: ${{ steps.filter.outputs.web4 }}
      storage: ${{ steps.filter.outputs.storage }}
      media: ${{ steps.filter.outputs.media }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="HEAD"
          else
            base="${{ github.event.before }}"
            head="HEAD"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "${head}" > /tmp/changed-files
          else
            git diff --name-only "${base}" "${head}" > /tmp/changed-files
          fi

          web=false
          kms=false
          web4=false
          storage=false
          media=false
          contracts=false
          docs=false

          if grep -Eq '^\.github/workflows/' /tmp/changed-files; then
            web=true
            kms=true
            web4=true
            storage=true
            media=true
            contracts=true
            docs=true
          fi

          if grep -Eq '^apps/web/' /tmp/changed-files; then
            web=true
          fi

          if grep -Eq '^(workers/youtick-kms/|workers/shared/)' /tmp/changed-files; then
            kms=true
          fi

          if grep -Eq '^(workers/web4-proxy/|workers/shared/)' /tmp/changed-files; then
            web4=true
          fi

          if grep -Eq '^(workers/storage-api/|workers/shared/)' /tmp/changed-files; then
            storage=true
          fi

          if grep -Eq '^(workers/media-delivery/|workers/shared/)' /tmp/changed-files; then
            media=true
          fi

          if grep -Eq '^(contracts/|scripts/deploy-nft-mainnet\.mjs$|docs/operations/mainnet-deploy-runbook\.md$)' /tmp/changed-files; then
            contracts=true
          fi

          if grep -Eq '^docs/' /tmp/changed-files; then
            docs=true
          fi

          {
            echo "web=${web}"
            echo "kms=${kms}"
            echo "web4=${web4}"
            echo "storage=${storage}"
            echo "media=${media}"
            echo "contracts=${contracts}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.css', 'apps/web/**/*.mjs', 'apps/web/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Build Web4 export
        run: npm run build:web4

      - name: Enforce Web bundle budget
        run: node ../../scripts/check-web-bundle-budget.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:smoke

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Build docs
        run: npm run build

  kms-worker:
    name: KMS Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kms == 'true'
    defaults:
      run:
        working-directory: workers/youtick-kms
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/youtick-kms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  web4-proxy-worker:
    name: Web4 Proxy Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web4 == 'true'
    defaults:
      run:
        working-directory: workers/web4-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/web4-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  storage-api-worker:
    name: Storage API Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    defaults:
      run:
        working-directory: workers/storage-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/storage-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  media-delivery-worker:
    name: Media Delivery Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.media == 'true'
    defaults:
      run:
        working-directory: workers/media-delivery
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/media-delivery/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install cargo-near
        run: cargo install cargo-near --version 0.18.0 --locked

      - name: Format check
        run: cargo fmt --all --check
        working-directory: contracts/nft-ticket

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts/nft-ticket

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/nft-ticket/target
            contracts/access-control/target
            contracts/operator-registry/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Test nft-ticket unit tests
        run: cargo test --lib
        working-directory: contracts/nft-ticket

      - name: Test nft-ticket sandbox tests
        run: cargo test --test sandbox
        working-directory: contracts/nft-ticket

      - name: Build nft-ticket wasm
        run: cargo near build non-reproducible-wasm
        working-directory: contracts/nft-ticket

      - name: Enforce WASM size budget
        run: node scripts/check-wasm-budget.mjs

      - name: Create canonical NFT artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nft-ticket
          cp contracts/nft-ticket/target/near/youtick_nft.wasm artifacts/nft-ticket/youtick_nft.wasm
          cp contracts/nft-ticket/target/near/youtick_nft_abi.json artifacts/nft-ticket/youtick_nft_abi.json
          wasm_sha="$(sha256sum artifacts/nft-ticket/youtick_nft.wasm | cut -d ' ' -f 1)"
          abi_sha="$(sha256sum artifacts/nft-ticket/youtick_nft_abi.json | cut -d ' ' -f 1)"
          rustc_version="$(rustc --version)"
          node -e 'const fs=require("node:fs"); fs.writeFileSync("artifacts/nft-ticket/manifest.json", JSON.stringify({commitSha:process.env.GITHUB_SHA,rustc:process.argv[1],wasmFile:"youtick_nft.wasm",wasmSha256:process.argv[2],abiFile:"youtick_nft_abi.json",abiSha256:process.argv[3]}, null, 2)+"\n")' "${rustc_version}" "${wasm_sha}" "${abi_sha}"

      - name: Upload canonical NFT artifact
        uses: actions/upload-artifact@v6
        with:
          name: nft-ticket-${{ github.sha }}
          path: artifacts/nft-ticket
          if-no-files-found: error
          retention-days: 30

      - name: Test access-control
        run: cargo test
        working-directory: contracts/access-control

      - name: Test operator-registry
        run: cargo test
        working-directory: contracts/operator-registry

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - security-policy
      - web
      - kms-worker
      - web4-proxy-worker
      - storage-api-worker
      - media-delivery-worker
      - contracts
      - docs
    if: always()
    steps:
      - name: Check required CI results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SECURITY_POLICY_RESULT: ${{ needs.security-policy.result }}
          WEB_RESULT: ${{ needs.web.result }}
          KMS_RESULT: ${{ needs.kms-worker.result }}
          WEB4_RESULT: ${{ needs.web4-proxy-worker.result }}
          STORAGE_RESULT: ${{ needs.storage-api-worker.result }}
          MEDIA_RESULT: ${{ needs.media-delivery-worker.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          set -euo pipefail

          for result in "${CHANGES_RESULT}" "${SECURITY_POLICY_RESULT}" "${WEB_RESULT}" "${KMS_RESULT}" "${WEB4_RESULT}" "${STORAGE_RESULT}" "${MEDIA_RESULT}" "${CONTRACTS_RESULT}" "${DOCS_RESULT}"; do
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "CI dependency result is ${result}"
                exit 1
                ;;
            esac
          done
