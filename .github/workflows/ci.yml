name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      kms: ${{ steps.filter.outputs.kms }}
      web4: ${{ steps.filter.outputs.web4 }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="HEAD"
          else
            base="${{ github.event.before }}"
            head="HEAD"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "${head}" > /tmp/changed-files
          else
            git diff --name-only "${base}" "${head}" > /tmp/changed-files
          fi

          web=false
          kms=false
          web4=false
          contracts=false

          if grep -Eq '^\.github/workflows/' /tmp/changed-files; then
            web=true
            kms=true
            web4=true
            contracts=true
          fi

          if grep -Eq '^apps/web/' /tmp/changed-files; then
            web=true
          fi

          if grep -Eq '^(workers/youtick-kms/|workers/shared/)' /tmp/changed-files; then
            kms=true
          fi

          if grep -Eq '^(workers/web4-proxy/|workers/shared/)' /tmp/changed-files; then
            web4=true
          fi

          if grep -Eq '^contracts/' /tmp/changed-files; then
            contracts=true
          fi

          {
            echo "web=${web}"
            echo "kms=${kms}"
            echo "web4=${web4}"
            echo "contracts=${contracts}"
          } >> "${GITHUB_OUTPUT}"

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.css', 'apps/web/**/*.mjs', 'apps/web/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  kms-worker:
    name: KMS Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kms == 'true'
    defaults:
      run:
        working-directory: workers/youtick-kms
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/youtick-kms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  web4-proxy-worker:
    name: Web4 Proxy Worker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web4 == 'true'
    defaults:
      run:
        working-directory: workers/web4-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/web4-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/nft-ticket/target
            contracts/access-control/target
            contracts/operator-registry/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Test nft-ticket unit tests
        run: cargo test --lib
        working-directory: contracts/nft-ticket

      - name: Test nft-ticket sandbox tests
        run: cargo test --test sandbox
        working-directory: contracts/nft-ticket

      - name: Build nft-ticket wasm
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts/nft-ticket

      - name: Test access-control
        run: cargo test
        working-directory: contracts/access-control

      - name: Test operator-registry
        run: cargo test
        working-directory: contracts/operator-registry

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - web
      - kms-worker
      - web4-proxy-worker
      - contracts
    if: always()
    steps:
      - name: Check required CI results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web.result }}
          KMS_RESULT: ${{ needs.kms-worker.result }}
          WEB4_RESULT: ${{ needs.web4-proxy-worker.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          set -euo pipefail

          for result in "${CHANGES_RESULT}" "${WEB_RESULT}" "${KMS_RESULT}" "${WEB4_RESULT}" "${CONTRACTS_RESULT}"; do
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "CI dependency result is ${result}"
                exit 1
                ;;
            esac
          done
