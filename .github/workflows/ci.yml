name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  kms-worker:
    name: KMS Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/youtick-kms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/youtick-kms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  web4-proxy-worker:
    name: Web4 Proxy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/web4-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/web4-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Type check
        run: npm run check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Test nft-ticket unit tests
        run: cargo test --lib
        working-directory: contracts/nft-ticket

      - name: Test nft-ticket sandbox tests
        run: cargo test --test sandbox
        working-directory: contracts/nft-ticket

      - name: Build nft-ticket wasm
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts/nft-ticket

      - name: Test access-control
        run: cargo test
        working-directory: contracts/access-control

      - name: Test operator-registry
        run: cargo test
        working-directory: contracts/operator-registry
