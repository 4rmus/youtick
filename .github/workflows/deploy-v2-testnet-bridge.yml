name: V2 Testnet Bridge

# Deploys the Livepeer Bridge on Market V2 to the separate V2 testnet environment.
# Runbook: docs/v2-testnet-runbook.md (Bridge). The relayer and payment service deploy from deploy-v2-testnet.yml.
# M1.5: the Bridge deploys to the media Cloudflare account (V2_MEDIA_CLOUDFLARE_*) and serves from its
# workers.dev host (docs/v2-testnet-runbook.md, Media account). The Bridge is no longer in the youtick.net
# zone and cannot affect the root origin, so this workflow does not fingerprint it; deploy-v2-testnet.yml still does.
# OD19 (M2-G6): the V2 Bridge is Stream-only. It carries no Livepeer Studio secret; the Cloudflare Stream
# adapter is switched per run with stream_enabled and its secrets are V2_STREAM_* (docs/v2-testnet-runbook.md,
# Stream cutover inputs).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main commit with successful push CI
        required: true
        type: string
      ci_run_id:
        description: Successful CI run for this commit
        required: true
        type: string
      mode:
        description: closed reports DISABLED; acceptance opens uploads for the named creators and V3 playback to http://localhost:3000
        type: choice
        default: closed
        options: [closed, acceptance]
      operator_key_set:
        description: Operator key method set the preflight accepts; any during the MC transition, neutral on the cutover run
        type: choice
        default: any
        options: [any, neutral, legacy]
      stream_enabled:
        description: MEDIA_PROVIDER_STREAM_ENABLED; true needs every Stream constant and V2_STREAM_* secret, and acceptance requires true
        type: choice
        default: 'false'
        options: ['false', 'true']
      confirmation:
        description: Type DEPLOY_V2_TESTNET_BRIDGE_closed or DEPLOY_V2_TESTNET_BRIDGE_acceptance
        required: true
        type: string

concurrency:
  group: v2-testnet-bridge
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      # The Bridge's workers.dev /__health, derived by bridgeHost() in the summary step.
      health_url: ${{ steps.summary.outputs.health_url }}
    steps:
      - name: Authorize exact main source and CI before checkout
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_MODE: ${{ inputs.mode }}
          OPERATOR_KEY_SET: ${{ inputs.operator_key_set }}
          STREAM_ENABLED: ${{ inputs.stream_enabled }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_MODE" =~ ^(closed|acceptance)$ ]]
          [[ "$OPERATOR_KEY_SET" =~ ^(any|neutral|legacy)$ ]]
          [[ "$STREAM_ENABLED" =~ ^(true|false)$ ]]
          [[ "$CONFIRMATION" == "DEPLOY_V2_TESTNET_BRIDGE_${RELEASE_MODE}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$REQUESTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success" and
            .head_repository.full_name == $repo' "$RUNNER_TEMP/ci.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${REQUESTED_SHA}...main" --jq '.status' | grep -Ex 'ahead|identical'
          printf 'sha=%s\n' "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/livepeer-bridge/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: workers/livepeer-bridge
      - name: Build the Bridge without deploying
        env:
          SHA: ${{ steps.authorize.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          OPERATOR_KEY_SET: ${{ inputs.operator_key_set }}
          MEDIA_PROVIDER_STREAM_ENABLED: ${{ inputs.stream_enabled }}
          READ_MODEL_D1_ID: ${{ vars.V2_READ_MODEL_D1_ID }}
        run: |
          set -euo pipefail
          workers/livepeer-bridge/node_modules/.bin/wrangler deploy --dry-run --cwd workers/livepeer-bridge --outdir "$RUNNER_TEMP/build"
          mkdir -p "$RUNNER_TEMP/release"
          install -m 0644 "$RUNNER_TEMP/build/index.js" "$RUNNER_TEMP/release/index.js"
          node scripts/v2-testnet-bridge-release.mjs write-config "$RUNNER_TEMP/release"
          node scripts/v2-testnet-bridge-release.mjs check "$RUNNER_TEMP/release" "$SHA" "$RELEASE_MODE"
          jq -n --arg sha "$SHA" --arg mode "$RELEASE_MODE" --arg keyset "$OPERATOR_KEY_SET" --arg stream "$MEDIA_PROVIDER_STREAM_ENABLED" --arg run "$(jq -r .id "$RUNNER_TEMP/ci.json")" \
            '{schema:"youtick.v2-testnet-bridge-release.v1", sha:$sha, mode:$mode, operator_key_set:$keyset, stream_enabled:$stream, ci_run_id:$run}' > "$RUNNER_TEMP/release/manifest.json"
          (cd "$RUNNER_TEMP/release" && find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
      - name: Summarize the exact packet for environment approval
        id: summary
        env:
          SHA: ${{ steps.authorize.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          OPERATOR_KEY_SET: ${{ inputs.operator_key_set }}
          MEDIA_PROVIDER_STREAM_ENABLED: ${{ inputs.stream_enabled }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { BRIDGE, bridgeHost, bridgeVars, releaseVars, streamFlag, streamWebhookUrl } from './scripts/v2-testnet-bridge-release.mjs';
          const streamEnabled = streamFlag(process.env.MEDIA_PROVIDER_STREAM_ENABLED);
          const packet = {
            worker: BRIDGE.worker, account: 'media', host: bridgeHost(), operator_key_set: process.env.OPERATOR_KEY_SET,
            stream_enabled: streamEnabled, stream_webhook_url: streamWebhookUrl(),
            flags: releaseVars(process.env.RELEASE_MODE), vars: bridgeVars({ streamEnabled }),
          };
          appendFileSync(process.env.GITHUB_OUTPUT, `health_url=https://${bridgeHost()}/__health\n`);
          const sums = readFileSync(`${process.env.RUNNER_TEMP}/release/SHA256SUMS`, 'utf8');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `V2 testnet Bridge, ${process.env.RELEASE_MODE}, ${process.env.SHA} (no NEAR transaction in this workflow):\n\n` +
            '```json\n' + JSON.stringify(packet, null, 2) + '\n```\n\n```\n' + sums + '```\n');
          JS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-testnet-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: prepare
    permissions:
      contents: read
      actions: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: v2-testnet
      url: ${{ needs.prepare.outputs.health_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/livepeer-bridge/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v2-testnet-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify protected environment, provenance and reviewed packet
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          OPERATOR_KEY_SET: ${{ inputs.operator_key_set }}
          STREAM_ENABLED: ${{ inputs.stream_enabled }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/v2-testnet" | jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length) > 0)'
          cd "$RUNNER_TEMP/release"
          sha256sum --strict -c SHA256SUMS
          [[ "$(find . -type f ! -name SHA256SUMS | wc -l)" == "$(wc -l < SHA256SUMS)" ]]
          while read -r _ file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-v2-testnet-bridge.yml" --source-digest "$SHA"
          done < SHA256SUMS
          jq -e --arg sha "$SHA" --arg mode "$RELEASE_MODE" --arg keyset "$OPERATOR_KEY_SET" --arg stream "$STREAM_ENABLED" \
            '.sha == $sha and .mode == $mode and .operator_key_set == $keyset and .stream_enabled == $stream' manifest.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: workers/livepeer-bridge
      - name: Preflight keys on chain, deploy the Bridge and smoke it
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.V2_MEDIA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.V2_MEDIA_CLOUDFLARE_API_TOKEN }}
          NEAR_RPC_URL: ${{ secrets.V2_NEAR_RPC_URL }}
          LIVEPEER_PAID_MEDIA_OPERATOR_TOKEN: ${{ secrets.V2_LIVEPEER_PAID_MEDIA_OPERATOR_TOKEN }}
          NEAR_OPERATOR_PRIVATE_KEY: ${{ secrets.V2_BRIDGE_NEAR_OPERATOR_PRIVATE_KEY }}
          CREATOR_FEE_QUOTE_PRIVATE_KEY: ${{ secrets.V2_CREATOR_FEE_QUOTE_PRIVATE_KEY }}
          # Read only when stream_enabled is true (OD19); the Studio trio is no longer mapped.
          STREAM_API_TOKEN: ${{ secrets.V2_STREAM_API_TOKEN }}
          STREAM_WEBHOOK_SECRET: ${{ secrets.V2_STREAM_WEBHOOK_SECRET }}
          STREAM_WEBHOOK_SECRET_PREVIOUS: ${{ secrets.V2_STREAM_WEBHOOK_SECRET_PREVIOUS }}
          STREAM_SIGNING_KEY_PEM: ${{ secrets.V2_STREAM_SIGNING_KEY_PEM }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          OPERATOR_KEY_SET: ${{ inputs.operator_key_set }}
          MEDIA_PROVIDER_STREAM_ENABLED: ${{ inputs.stream_enabled }}
        run: node scripts/v2-testnet-bridge-release.mjs deploy "$SHA" "$RUNNER_TEMP/release" "$RUNNER_TEMP/v2-testnet-bridge-receipt.json" "$RELEASE_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v2-testnet-bridge-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-testnet-bridge-receipt.json
          if-no-files-found: warn
          retention-days: 30
