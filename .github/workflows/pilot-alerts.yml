name: Public Testnet Pilot Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: public-testnet-pilot-alerts
  cancel-in-progress: false

permissions: {}

jobs:
  evaluate:
    name: Evaluate critical pilot signals
    # Closed by default: scheduling starts only after the channel and monitor token are provisioned.
    if: github.ref == 'refs/heads/main' && vars.PILOT_ALERTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: public-testnet
      url: https://public-testnet.youtick.net
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read telemetry and DLQ, post breaches to Google Chat
        shell: bash
        env:
          # Read-only monitor token: Account Analytics Read, Queues Read, Workers Observability (query).
          CLOUDFLARE_MONITOR_TOKEN: ${{ secrets.PUBLIC_TESTNET_CLOUDFLARE_MONITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PUBLIC_TESTNET_CLOUDFLARE_ACCOUNT_ID }}
          OPS_ALERT_CHAT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_CHAT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          node scripts/pilot-alerts.mjs >> "${GITHUB_STEP_SUMMARY}"
