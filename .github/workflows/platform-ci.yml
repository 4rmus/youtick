name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'workers/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'workers/**'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract Tests (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - contracts/nft-ticket
          - contracts/access-control
          - contracts/operator-registry
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-ci-contracts
          workspaces: |
            contracts/nft-ticket -> target
            contracts/access-control -> target
            contracts/operator-registry -> target
      - name: Install NFT wasm build toolchain
        if: ${{ matrix.path == 'contracts/nft-ticket' }}
        run: rustup toolchain install 1.86.0 --target wasm32-unknown-unknown --profile minimal --no-self-update
      - name: Install cargo-near system dependencies
        if: ${{ matrix.path == 'contracts/nft-ticket' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
      - name: Restore cargo-near cache
        if: ${{ matrix.path == 'contracts/nft-ticket' }}
        id: cargo-near-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-near
            ~/.cargo/.crates2.json
            ~/.cargo/.crates.toml
          key: cargo-near-${{ runner.os }}-0.18.0
      - name: Install cargo-near
        if: ${{ matrix.path == 'contracts/nft-ticket' && steps.cargo-near-cache.outputs.cache-hit != 'true' }}
        run: cargo install cargo-near --locked --version 0.18.0
      - name: Build NFT wasm for sandbox tests
        if: ${{ matrix.path == 'contracts/nft-ticket' }}
        run: cargo +1.86.0 near build non-reproducible-wasm
        working-directory: contracts/nft-ticket
      - name: Run cargo test
        run: cargo test
        working-directory: ${{ matrix.path }}

  workers:
    name: Worker Typecheck (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - workers/youtick-kms
          - workers/web4-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ matrix.path }}
      - name: Typecheck worker
        run: npx tsc --noEmit
        working-directory: ${{ matrix.path }}
