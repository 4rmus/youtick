name: Public Testnet Video

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main commit with successful push CI
        required: true
        type: string
      ci_run_id:
        description: Successful CI run for this commit
        required: true
        type: string
      mode:
        description: closed stops everything; drain stops only new uploads
        type: choice
        default: closed
        options: [closed, acceptance, drain]
      confirmation:
        description: Type DEPLOY_PUBLIC_TESTNET_closed, DEPLOY_PUBLIC_TESTNET_acceptance or DEPLOY_PUBLIC_TESTNET_drain
        required: true
        type: string

concurrency:
  group: public-testnet-video
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Authorize exact main source and CI before checkout
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_MODE" =~ ^(closed|acceptance|drain)$ ]]
          [[ "$CONFIRMATION" == "DEPLOY_PUBLIC_TESTNET_${RELEASE_MODE}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$REQUESTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success" and
            .head_repository.full_name == $repo' "$RUNNER_TEMP/ci.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${REQUESTED_SHA}...main" --jq '.status' | grep -Ex 'ahead|identical'
          printf 'sha=%s\n' "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            workers/livepeer-bridge/package-lock.json
      - name: Build canonical public configuration from closed base
        env:
          CLOSED_CONFIG_JSON: ${{ vars.PUBLIC_TESTNET_RELEASE_CONFIG }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(`${process.env.RUNNER_TEMP}/closed-config.json`, process.env.CLOSED_CONFIG_JSON || "");'
          node scripts/release-metadata.mjs config --environment public-testnet \
            --input "$RUNNER_TEMP/closed-config.json" --mode "$RELEASE_MODE" \
            --output "$RUNNER_TEMP/release/public-testnet-config.json"
          jq -r '.web | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/release/public-testnet-config.json" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: workers/livepeer-bridge
      - name: Generate runtime SBOMs
        run: |
          (cd apps/web && npm sbom --omit=dev --sbom-format=spdx) > "$RUNNER_TEMP/web.spdx.json"
          (cd workers/livepeer-bridge && npm sbom --omit=dev --sbom-format=spdx) > "$RUNNER_TEMP/bridge.spdx.json"
      - name: Build public Web without deploying
        run: npm run build:cloudflare
        working-directory: apps/web
      - name: Build Bridge and read-model without deploying
        run: |
          workers/livepeer-bridge/node_modules/.bin/wrangler deploy --dry-run --cwd workers/livepeer-bridge --outdir "$RUNNER_TEMP/bridge-output"
          workers/livepeer-bridge/node_modules/.bin/wrangler deploy --dry-run --cwd read-model --outdir "$RUNNER_TEMP/read-model-output"
          node scripts/cloudflare-release.mjs write-bridge-wrangler "$RUNNER_TEMP/bridge-output/wrangler.toml"
          node scripts/cloudflare-release.mjs write-read-model-wrangler "$RUNNER_TEMP/read-model-output/wrangler.toml"
      - name: Pack and verify isolated release
        env:
          SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/release/web-public-testnet.tar.gz" -C apps/web .open-next wrangler.jsonc
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/release/bridge.tar.gz" -C "$RUNNER_TEMP/bridge-output" index.js wrangler.toml
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/release/read-model.tar.gz" -C "$RUNNER_TEMP/read-model-output" worker.js wrangler.toml
          node scripts/release-metadata.mjs manifest --environment public-testnet --sha "$SHA" \
            --run-id "$(jq -r .id "$RUNNER_TEMP/ci.json")" --run-attempt "$(jq -r .run_attempt "$RUNNER_TEMP/ci.json")" \
            --web-lock apps/web/package-lock.json --bridge-lock workers/livepeer-bridge/package-lock.json \
            --web-public-testnet "$RUNNER_TEMP/release/web-public-testnet.tar.gz" \
            --public-testnet-config "$RUNNER_TEMP/release/public-testnet-config.json" \
            --bridge "$RUNNER_TEMP/release/bridge.tar.gz" --read-model "$RUNNER_TEMP/release/read-model.tar.gz" \
            --output-dir "$RUNNER_TEMP/release"
          node scripts/release-metadata.mjs verify --artifact-dir "$RUNNER_TEMP/release" --sha "$SHA" \
            --web-lock apps/web/package-lock.json --bridge-lock workers/livepeer-bridge/package-lock.json
      - name: Summarize the exact packet for environment approval
        env:
          SHA: ${{ steps.authorize.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release/public-testnet-config.json`));
          const packet = { sha: process.env.SHA, mode: process.env.RELEASE_MODE, ...config };
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Public testnet packet (no media/payment/NEAR transaction in this workflow):\n\n```json\n' + JSON.stringify(packet, null, 2) + '\n```\n');
          JS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/web-public-testnet.tar.gz
          sbom-path: ${{ runner.temp }}/web.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/bridge.tar.gz
          sbom-path: ${{ runner.temp }}/bridge.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-testnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: prepare
    permissions:
      contents: read
      actions: read
      attestations: read
    if: vars.DEPLOY_PUBLIC_TESTNET_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: public-testnet
      url: https://public-testnet.youtick.net
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-testnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify protected environment, provenance and reviewed mode
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/public-testnet" | jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length) > 0)'
          for file in "$RUNNER_TEMP"/release/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-public-testnet.yml"
          done
          node scripts/release-metadata.mjs verify --artifact-dir "$RUNNER_TEMP/release" --sha "$SHA" \
            --web-lock apps/web/package-lock.json --bridge-lock workers/livepeer-bridge/package-lock.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {publicTestnetMode} from "./scripts/release-metadata.mjs"; if(publicTestnetMode(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release/public-testnet-config.json`)))!==process.env.RELEASE_MODE) throw new Error("reviewed_mode_mismatch");'
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - name: Fingerprint unrelated root origin
        run: node scripts/release-smoke.mjs fingerprint https://youtick.net > "$RUNNER_TEMP/root-before.json"
      - name: Deploy only the reviewed public-testnet artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PUBLIC_TESTNET_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUBLIC_TESTNET_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.PUBLIC_TESTNET_CLOUDFLARE_ZONE_ID }}
          NEAR_RPC_URL: ${{ secrets.PUBLIC_TESTNET_NEAR_RPC_URL }}
          LIVEPEER_API_KEY: ${{ secrets.PUBLIC_TESTNET_LIVEPEER_API_KEY }}
          LIVEPEER_WEBHOOK_SECRET: ${{ secrets.PUBLIC_TESTNET_LIVEPEER_WEBHOOK_SECRET }}
          LIVEPEER_JWT_PRIVATE_KEY: ${{ secrets.PUBLIC_TESTNET_LIVEPEER_JWT_PRIVATE_KEY }}
          LIVEPEER_PAID_MEDIA_OPERATOR_TOKEN: ${{ secrets.PUBLIC_TESTNET_LIVEPEER_PAID_MEDIA_OPERATOR_TOKEN }}
          NEAR_OPERATOR_PRIVATE_KEY: ${{ secrets.PUBLIC_TESTNET_NEAR_OPERATOR_PRIVATE_KEY }}
          CREATOR_FEE_QUOTE_PRIVATE_KEY: ${{ secrets.PUBLIC_TESTNET_CREATOR_FEE_QUOTE_PRIVATE_KEY }}
          NEAR_SPONSOR_RELAYER_PRIVATE_KEY: ${{ secrets.PUBLIC_TESTNET_NEAR_SPONSOR_RELAYER_PRIVATE_KEY }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/cloudflare-release.mjs deploy public-testnet "$SHA" "$RUNNER_TEMP/release" "$RUNNER_TEMP/public-testnet-deployment.json"
      - name: Verify unrelated root origin
        run: |
          node scripts/release-smoke.mjs fingerprint https://youtick.net > "$RUNNER_TEMP/root-after.json"
          node scripts/release-smoke.mjs compare "$RUNNER_TEMP/root-before.json" "$RUNNER_TEMP/root-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-testnet-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-testnet-deployment.json
          if-no-files-found: warn
          retention-days: 30
